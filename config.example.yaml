# Workers this server registers. llm-call-v1 needs the model settings below;
# exec-command-v1 needs exec_root below. List only what your processes use.
workers: llm-call-v1,exec-command-v1
engine_rest: http://localhost:8080
engine_grpc: localhost:9090
# Workspace directory exec-command-v1 jobs run in.
exec_root: .
model: qwen3:4b
api_key: ""
# The OpenAI-compatible endpoint the workers call. Point it at your local
# Ollama (http://localhost:11434/v1) or vLLM, or at OpenAI together with an
# api_key. The api_key is a credential: it never selects another endpoint.
api_base: http://localhost:11434/v1

# How long the engine reserves a delivered job for this worker. It must
# outlast the longest job the worker runs (120 s for the built-in workers),
# or the engine hands the job to a second worker while the first is busy.
lock_duration: 5m
# Jobs of one type this worker holds at once. 0 uses the engine default (10).
max_active_jobs: 0
# Name of this worker at the engine. It must be unique per process; the
# default is the host name, the pid and a random suffix.
# client_id: ""

# Directory the journal of the finished steps lives in. A job the engine
# hands out again repeats its result instead of running its work again.
# Leave it empty to turn the journal off.
# journal_dir: ./data/journal
# How long a claim on a step lasts. A worker which dies while it holds a step
# releases it after this time.
journal_lease: 5m

# Lowest level the server logs: debug, info, warn or error. Every job is
# logged with its key, its instance, its element and its outcome; every
# provider call with its model, its duration and its token usage.
log_level: info

# Named profiles for llm-call-v1. Credentials stay server-side.
# The default profile falls back to the model/api_* settings above if omitted.
# model_profiles:
#   reviewer:
#     base_url: http://localhost:11434/v1
#     model: qwen3:4b
#     api_key: ""
